name: Bug Report
description: Report a plugin not loading, crashing, or behaving incorrectly
labels: [bug]
body:
  - type: input
    id: server-version
    attributes:
      label: Folia Version
      description: Output of `/version`
      placeholder: e.g. git-Folia-39 (MC: 1.19.4)
    validations:
      required: true
  - type: input
    id: foliacompat-version
    attributes:
      label: FoliaCompat Version
      description: Version shown on startup or from `/fc list`
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: plugin-name
    attributes:
      label: Affected Plugin
      description: Name of the plugin that fails
    validations:
      required: true
  - type: textarea
    id: console-log
    attributes:
      label: Console Log
      description: Full log from server startup through the error (especially lines with `[FoliaCompat]` and any stack traces)
      render: text
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happens, what you expected, and any relevant context
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config (optional)
      description: Your `plugins/FoliaCompat/config.yml` (remove any sensitive info)
      render: yaml
