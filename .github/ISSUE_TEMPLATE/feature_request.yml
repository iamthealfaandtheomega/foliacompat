name: Feature Request
description: Suggest a new feature or compatibility improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or missing functionality are you hitting?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds you've tried
  - type: input
    id: plugin-name
    attributes:
      label: Related Plugin (optional)
      description: If this is about a specific plugin
